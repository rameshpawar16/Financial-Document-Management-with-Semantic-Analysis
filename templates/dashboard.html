<!doctype html>
<html>
  <head>
    <title>Document AI Assistant</title>
    <link rel="stylesheet" href="/static/dashboard.css?v=11" />
  </head>

  <body>
    <div class="topbar">
      <div class="title">Document Assistant</div>

      <div class="menu-container">
        <button id="menuBtn" onclick="toggleMenu()" title="Menu">
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
          >
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div id="menuDropdown" class="dropdown hidden">
          <div
            style="display: flex; align-items: center; gap: 10px; padding: 10px"
          >
            <div id="avatarCircle" class="avatar-circle">
              <span id="avatarLetter">U</span>
            </div>
            <div id="currentUser" style="font-weight: bold; padding: 0"></div>
          </div>
          <hr style="margin: 0; border: none; border-top: 1px solid #ddd" />
          <div id="addRoleBtn">Add Role</div>
          <div id="removeUserBtn">Remove User</div>
          <div
            id="logoutBtn"
            style="
              cursor: pointer;
              color: #e74c3c;
              display: flex;
              align-items: center;
              gap: 8px;
            "
          >
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16,17 21,12 16,7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Logout
          </div>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
          <h3 style="margin: 0;"> Your chats</h3>
          <button id="newChatBtn" onclick="startNewChat()" title="New Chat" style="background: none; border: none; cursor: pointer; padding: 5px; color: #555; display: flex; align-items: center; justify-content: center; border-radius: 5px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
        </div>
        <ul id="history"></ul>
      </div>
      <!-- MAIN -->
      <div class="main">
        <h2>Upload Document</h2>

        <input
          type="file"
          id="file"
          onchange="uploadDoc()"
          style="display: none"
        />
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <button
            id="uploadBtn"
            onclick="document.getElementById('file').click()"
            style="
              background: #3498db;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              cursor: pointer;
            "
          >
            Upload
          </button>
          <button
            id="deleteDocsBtn"
            onclick="showDocuments()"
            style="
              display: none;
              background: #e74c3c;
              color: white;
              border: none;
              padding: 8px 16px;
              border-radius: 4px;
              cursor: pointer;
            "
          >
            Delete
          </button>
        </div>
        <div id="status"></div>

        <!-- Delete Documents for Admin only -->
        <div id="docListPanel" style="display: none; margin-top: 15px">
          <h3>
            All Documents
            <button
              onclick="hideDocuments()"
              style="margin-left: 10px; font-size: 12px; cursor: pointer"
            >
              &times; Close
            </button>
          </h3>
          <div id="docList"></div>
        </div>
        <hr />

        <!-- Chat Section -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; margin-top: 20px;">
          <h2 style="margin: 0;">Ask Question</h2>
          <button id="deleteCurrentChatBtn" onclick="deleteCurrentChat()" style="background: none; border: none; color: #e74c3c; cursor: pointer; padding: 5px; display: flex; align-items: center;" title="Delete this chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>
        </div>
        <div class="chat-container">
          <div id="chatMessages" class="chat-messages"></div>
          <div class="chat-input-bar">
            <input
              type="text"
              id="question"
              placeholder="Ask about your document..."
              onkeypress="if (event.key === 'Enter') askQuestion();"
            />
            <button onclick="askQuestion()" class="send-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          </div>
        </div>
        <div id="loader" style="display: none"></div>
      </div>
    <script src="/static/dashboard.js?v=12"></script>
  </body>
</html>
